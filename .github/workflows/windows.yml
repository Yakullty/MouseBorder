name: Windows portable exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        working-directory: native
        run: cargo build --release --features tauri/custom-protocol
      - name: Stage portable exe
        run: |
          New-Item -ItemType Directory -Force build-output | Out-Null
          Copy-Item native/target/release/mouseborder-native.exe build-output/MouseBorder-Windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MouseBorder-Windows-x64
          path: build-output/MouseBorder-Windows-x64.exe
