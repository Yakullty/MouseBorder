[package]
name = "mouseborder-native"
version = "0.3.5"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rdev = { version = "0.5.3", features = ["unstable_grab"] }
display-info = "0.5"

# Direct clipboard writes for the two paths arboard gets wrong (macOS image via CGImageCreate,
# Windows file-list without emptying). Versions match arboard's so no duplicate crates are built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The mock peer signs and re-serializes bodies as serde_json::Value; without preserve_order the
# map would come back key-sorted and the HMAC would not match the app's declaration-ordered bytes.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
