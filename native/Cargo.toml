[package]
name = "mouseborder-native"
version = "0.3.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tauri = { version = "2", features = [] }
arboard = "3"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
rdev = { version = "0.5.3", features = ["unstable_grab"] }
display-info = "0.5"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The mock peer signs and re-serializes bodies as serde_json::Value; without preserve_order the
# map would come back key-sorted and the HMAC would not match the app's declaration-ordered bytes.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
