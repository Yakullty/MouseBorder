<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MouseBorder</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><h1>MouseBorder</h1><div class="badges"><span id="control" class="badge">本机控制</span><span id="status" class="badge">正在启动</span><button id="disconnect" class="mini hidden">断开</button></div></header>
<section class="me"><div><small>本机</small><b id="hostname">—</b></div><div class="pin"><small>配对码</small><strong id="pin">------</strong><button id="refreshPin" class="mini">刷新</button></div></section>
<section id="devices" class="block hidden"><h2>已授权设备</h2><div id="deviceList"></div></section>
<section class="block"><h2>连接新设备</h2><div class="form"><input id="ip" placeholder="对方 IP" autocomplete="off"><input id="pairPin" placeholder="6 位配对码" inputmode="numeric" maxlength="6"><button id="connect" class="button">连接</button></div></section>
<section class="block"><h2>设置</h2>
<label class="row"><span>边缘切换<small>触到边缘交给对端，Ctrl+Alt+Esc 交还</small></span><input id="edgeEnabled" type="checkbox"></label>
<label class="row"><span>屏幕边缘</span><select id="edge"><option value="right">右侧</option><option value="left">左侧</option><option value="top">上侧</option><option value="bottom">下侧</option></select></label>
<label class="row"><span>同步剪贴板<small>文字、图片、截图与文件</small></span><input id="clipboard" type="checkbox"></label>
<div class="row"><span>输入捕获<small>需辅助功能与输入监控权限</small></span><span class="hook"><em id="hookState" class="badge">未启动</em><button id="retryHook" class="mini">重试</button></span></div>
</section>
<p id="notice" class="notice hidden"></p><p id="error" class="error hidden"></p>
</main><script src="renderer.js"></script></body></html>
