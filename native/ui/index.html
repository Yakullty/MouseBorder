<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MouseBorder</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div class="brand"><div class="logo">↔</div><div><h1>MouseBorder</h1><p>让两台电脑像一台一样工作</p></div></div><div class="badges"><span id="control" class="badge">本机控制</span><span id="status" class="badge">正在启动</span></div></header>
<section class="hero"><div><div class="eyebrow">本机设备</div><h2 id="hostname">—</h2><p>确保 Mac 与 Windows 连接到同一个局域网。</p></div><div class="pinbox"><span>本机配对码</span><strong id="pin">------</strong><button id="refreshPin" class="button secondary">刷新配对码</button><small>连接时需输入此设备当前配对码</small></div></section>
<div class="grid"><section class="card"><div class="card-title"><div><h3>手动连接设备</h3><p>仅连接你指定的 IP，不广播或自动发现设备</p></div><span class="live">手动连接</span></div><div class="connect-form"><label>对方 IP 地址<input id="ip" placeholder="例如 192.168.1.25" autocomplete="off"></label><label>对方当前配对码<input id="pairPin" placeholder="6 位数字" inputmode="numeric" maxlength="6"></label><button id="connect" class="button">连接</button></div><div id="error" class="error hidden"></div><div id="connected" class="connected hidden"></div></section>
<section class="card settings"><div class="card-title"><div><h3>控制设置</h3><p>选择鼠标从屏幕哪一侧移出时切换</p></div></div><label class="row"><span><b>启用边缘切换</b><small>光标触到边缘后将控制另一台电脑</small></span><input id="edgeEnabled" type="checkbox"></label><label class="row"><span><b>屏幕边缘</b><small>建议把两台电脑的显示器摆放方向对应起来</small></span><select id="edge"><option value="right">右侧</option><option value="left">左侧</option><option value="top">上侧</option><option value="bottom">下侧</option></select></label><label class="row"><span><b>同步剪贴板</b><small>复制文本后自动同步到配对设备</small></span><input id="clipboard" type="checkbox" checked></label><div class="row"><span><b>输入捕获</b><small>需要「辅助功能」与「输入监控」权限；授权后不必重启，直接重试即可生效</small></span><span class="hook"><em id="hookState" class="badge">未启动</em><button id="retryHook" class="button secondary">重试捕获</button></span></div></section></div>
<footer><span>MouseBorder · 局域网直连</span><span id="platform"></span></footer></main><script src="renderer.js"></script></body></html>
